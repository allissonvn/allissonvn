<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Allisson Viana - perfil" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2230" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#FF2D2D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2D2D"/>
      <stop offset="1" stop-color="#FF2D2D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="240" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="240" fill="#0d1117"/>
    <rect width="1000" height="240" fill="url(#g)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="880" cy="60" r="90" fill="#FF2D2D" opacity="0.08">
      <animate attributeName="r" values="80;110;80" dur="7s" repeatCount="indefinite"/>
    </circle>
    <rect x="0" y="0" width="1000" height="4" fill="#FF2D2D"/>
    <text x="70" y="75" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="18" fill="#FF2D2D">
      <tspan>$ whoami</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
    </text>
    <text x="70" y="140" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="62" font-weight="800" fill="#F5F5F5">Allisson Viana
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1s" fill="freeze"/>
    </text>
    <text x="72" y="182" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="22" fill="#9aa4b2">@allissonvn
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="1s" fill="freeze"/>
    </text>
    <rect x="260" y="164" width="12" height="24" fill="#FF2D2D">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="-400" y="232" width="400" height="8" fill="url(#bar)">
      <animate attributeName="x" from="-400" to="1000" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="239" rx="14" fill="none" stroke="#FF2D2D" stroke-opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
